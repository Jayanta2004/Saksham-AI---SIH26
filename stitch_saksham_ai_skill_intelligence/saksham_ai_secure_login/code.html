<style>
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(9, 13, 22, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .input-glass:focus-within {
            border-color: #06B6D4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .gradient-button {
            background: linear-gradient(135deg, #005ac2 0%, #06B6D4 100%);
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gradient-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #06B6D4 0%, #A855F7 100%);
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .gradient-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
        }

        .gradient-button:hover::before {
            opacity: 1;
        }

        .demo-card {
            transition: all 0.2s ease;
        }
        
        .demo-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(168, 85, 247, 0.3);
        }
    </style>

<body class="bg-surface-obsidian text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-ai-cyan selection:text-surface-obsidian p-4">
<!-- Ambient Background Glow -->
<div class="glow-bg"></div>
<!-- Login Container -->
<main class="glass-panel w-full max-w-[440px] rounded-3xl p-8 relative z-10 animate-fade-in-up">
<!-- Header -->
<header class="text-center mb-8 flex flex-col items-center">
<!-- Logo Badge -->
<div class="w-16 h-16 rounded-2xl bg-surface-slate border border-glass-border flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(6,182,212,0.2)] relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-tr from-ai-cyan/20 to-ai-purple/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<span class="font-headline-xl text-headline-xl text-transparent bg-clip-text bg-gradient-to-r from-ai-cyan to-ai-purple font-bold">S</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Sign in to Saksham AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Official Statistical System Intelligence Platform</p>
</header>
<!-- Login Form -->
<form class="space-y-stack-md mb-8">
<!-- Email Input -->
<div class="input-glass rounded-xl flex items-center px-4 py-3 group">
<span class="material-symbols-outlined text-outline group-focus-within:text-ai-cyan transition-colors mr-3" data-icon="mail">mail</span>
<input class="bg-transparent border-none w-full text-on-surface placeholder-on-surface-variant focus:ring-0 p-0 font-body-md text-body-md" placeholder="Official Email Address" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="input-glass rounded-xl flex items-center px-4 py-3 group">
<span class="material-symbols-outlined text-outline group-focus-within:text-ai-cyan transition-colors mr-3" data-icon="lock">lock</span>
<input class="bg-transparent border-none w-full text-on-surface placeholder-on-surface-variant focus:ring-0 p-0 font-body-md text-body-md" id="password-input" placeholder="Password" required="" type="password"/>
<button class="ml-2 text-outline hover:text-on-surface focus:outline-none flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-4">
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-4 h-4">
<input class="peer sr-only" type="checkbox"/>
<div class="w-4 h-4 rounded border border-outline-variant bg-surface-slate peer-checked:bg-ai-cyan peer-checked:border-ai-cyan transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-surface-obsidian opacity-0 peer-checked:opacity-100" data-icon="check" data-weight="fill">check</span>
</div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember credentials</span>
</label>
<a class="font-label-md text-label-md text-ai-cyan hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="gradient-button w-full rounded-xl py-3.5 font-label-md text-label-md text-white font-semibold mt-6 shadow-[0_0_15px_rgba(6,182,212,0.3)]" type="submit">
                Sign In with Secure SSO
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-4 mb-4">
<div class="flex-grow border-t border-glass-border"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-outline tracking-wider uppercase">OR EXPLORE INSTANT DEMO PERSONAS</span>
<div class="flex-grow border-t border-glass-border"></div>
</div>
<!-- Demo Personas -->
<div class="space-y-stack-sm mb-8">
<!-- Persona 1 -->
<button class="demo-card w-full glass-panel rounded-xl p-3 flex items-center text-left group" type="button">

<!-- Micro badge -->
<div class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-ai-cyan border-2 border-surface-obsidian shadow-[0_0_8px_rgba(6,182,212,0.8)]"></div>
</div>
<div>
<h3 class="font-label-md text-label-md font-semibold text-on-surface group-hover:text-ai-cyan transition-colors">Arjun Sharma</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant line-clamp-1">Senior Statistical Officer (National Accounts Division)</p>
</div>
</button>
<!-- Persona 2 -->
<button class="demo-card w-full glass-panel rounded-xl p-3 flex items-center text-left group" type="button">
<div class="w-10 h-10 rounded-full overflow-hidden border border-glass-border mr-4 flex-shrink-0 relative">
<img class="w-full h-full object-cover" data-alt="A confident, professional headshot of an Indian woman, a Senior Faculty member. She wears elegant corporate attire. The background is a sleek academic or corporate training environment with subtle, modern light-mode aesthetics. Soft, high-key lighting creates an authoritative yet welcoming mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBinB0e4ceg1vWIzw6E89bozBlbjCIVfT3GtIA2wUgTBqe3PoJ0GDkJ7YSn-w9JQcQusUjUOQ97JjMW2R6bfbtCDS6VvDSQPyIp2_NypkXrflNI94HJwzTOSKFDjvRFLs89U7nNH4xVG3bDqAHZxItxCr3p7moSpabQKpFin9DdVJ1PzmVCoWbAPncolAAaL45JvjsRWZhhqLhNfDxntLjPn1GEr4lETlZaTy0TrE1vTL-0dJHUAjFecg"/>
<div class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-ai-purple border-2 border-surface-obsidian shadow-[0_0_8px_rgba(168,85,247,0.8)]"></div>
</div>
<div>
<h3 class="font-label-md text-label-md font-semibold text-on-surface group-hover:text-ai-cyan transition-colors">Dr. Radhika Sen</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant line-clamp-1">Senior Faculty &amp; Trainer (NSSTA Academy)</p>
</div>
</button>
<!-- Persona 3 -->
<button class="demo-card w-full glass-panel rounded-xl p-3 flex items-center text-left group" type="button">
<div class="w-10 h-10 rounded-full overflow-hidden border border-glass-border mr-4 flex-shrink-0 relative">
<img class="w-full h-full object-cover" data-alt="A dignified portrait of a senior Indian male executive, Director General, in formal business attire (suit and tie). Set in an opulent, minimalist high-level government office. The lighting is dramatic yet professional, conveying authority, scale, and high intelligence within a modern enterprise environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDJfLRmLTL4LASz7bmGpmy49B6OEVi3E7gpFTflNVp78nSxrI51KwD3bs5UKjrx0uhOF0fTdkG9R9PIbbk9ycgtN6ZtNMJRfYyVHKWSFLrNC25hfuWQS0zRC5FLbGukUerFyX9ttR0xmhE2wyfam38OowC_5zP5TgqFJa5alRA8Ybezc-MavXpsGU94lsJ5j1q4BktqE_LSWAutOyDj1QoE6XcE-G3WuyJi1qkLthxTG6RohL0x_Wnjg"/>
<div class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-success-emerald border-2 border-surface-obsidian shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
</div>
<div>
<h3 class="font-label-md text-label-md font-semibold text-on-surface group-hover:text-ai-cyan transition-colors">Dr. Rajesh Verma</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant line-clamp-1">Director General (MoSPI Directorate)</p>
</div>
</button>
</div>
<!-- Footer Links -->
<footer class="flex flex-col items-center justify-center space-y-2 mt-4 pt-4 border-t border-glass-border/50">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-ai-cyan transition-colors" href="#">Register Official Account</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-ai-cyan transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="shield">shield</span>
                MoSPI Security Verification
            </a>
</footer>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
                eyeIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
                eyeIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
